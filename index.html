<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Accueil</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <nav class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-gamepad text-2xl"></i>
                <span class="text-xl font-bold">GameStore</span>
            </div>
            <div class="flex gap-6">
                <a href="index.html" class="font-medium">Accueil</a>
                <a href="cart.html" class="relative font-medium flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-gray-700"></i>
                    Panier <span id="cart-count" class="bg-red-500 text-white text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                </a>
            </div>
        </nav>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="mb-10">
            <div class="max-w-md mb-6">
                <input type="text" id="search-input" placeholder="Search for games..." 
                    class="w-full bg-gray-100 border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-black outline-none">
            </div>

            <h3 class="font-bold mb-4">Categories</h3>
            <div id="category-filters" class="flex gap-2 flex-wrap">
                <button class="cat-btn bg-black text-white px-4 py-1 rounded-lg text-sm border border-black hover:bg-black hover:text-white transition" data-category="All">All</button>
                <button class="cat-btn bg-white px-4 py-1 rounded-lg text-sm border border-gray-200 hover:border-black transition" data-category="RPG">RPG</button>
                <button class="cat-btn bg-white px-4 py-1 rounded-lg text-sm border border-gray-200 hover:border-black transition" data-category="Action">Action</button>
                <button class="cat-btn bg-white px-4 py-1 rounded-lg text-sm border border-gray-200 hover:border-black transition" data-category="FPS">FPS</button>
                <button class="cat-btn bg-white px-4 py-1 rounded-lg text-sm border border-gray-200 hover:border-black transition" data-category="Sport">Sport</button>
            </div>
        </div>

        <div class="mb-8">
            <h2 class="text-4xl font-black mb-2">Découvrez nos jeux</h2>
            <p class="text-gray-400">Les meilleurs jeux vidéo au meilleur prix</p>
        </div>

        <div id="games-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            </div>
    </main>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
